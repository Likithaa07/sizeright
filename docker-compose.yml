services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sizer
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # read from .env, not hard-coded
      POSTGRES_DB: sizer
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data  # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sizer"]
      interval: 5s
      retries: 5

volumes:
  dbdata:
